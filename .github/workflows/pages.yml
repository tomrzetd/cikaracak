# Publikasi demo web Cikaracak tanpa menggabungkan firmware/Android dari PR pengembangan.
# Snapshot rilis: dashboard modular web v0.5.0 yang lulus uji browser.
# Jika ingin versi web lebih baru, tinjau dan perbarui ref ini melalui PR terpisah.
name: Pages - Demo Web Cikaracak

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo-cikaracak
  cancel-in-progress: true

jobs:
  deploy:
    name: Terbitkan web demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Ambil snapshot web yang telah diuji
        uses: actions/checkout@v4
        with:
          ref: 6af775bda9c35017cc6515ae743318178ee60400
          persist-credentials: false

      - name: Periksa struktur web dan berkas offline
        run: |
          node --version
          node tools/cek-web.js
          node --test tests/*.test.js

      - name: Persiapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Paketkan folder web saja
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Terbitkan ke GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
