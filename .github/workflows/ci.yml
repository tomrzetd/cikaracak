name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  uji:
    name: Uji unit & pemeriksaan web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - run: node tools/cek-web.js

  rls:
    name: Migrasi & aturan akses Supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/supabase/uji.sh

  e2e:
    name: Alur guru di browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/uji_e2e.py
        env:
          E2E_SHOT: e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tangkapan-layar-e2e
          path: e2e-shots/*.png

  android:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: cikaracak-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  firmware:
    name: Firmware alat presensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uji logika firmware (tanda HMAC sama dengan server)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/lib/logika tests/firmware/uji_logika.cpp firmware/lib/logika/*.cpp -o uji_logika
          ./uji_logika
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.1.16
      - run: pio run -d firmware
      - name: Gabungkan menjadi satu berkas siap flash (alamat 0x0)
        run: |
          P=~/.platformio/packages
          for e in uji-kartu hadir uji-kartu-s3 hadir-s3; do
            B=firmware/.pio/build/$e
            case $e in *-s3) CHIP=esp32s3; NAMA=${e%-s3}-esp32s3;; *) CHIP=esp32c3; NAMA=$e-esp32c3;; esac
            python $P/tool-esptoolpy/esptool.py --chip $CHIP merge_bin -o cikaracak-$NAMA.bin \
              --flash_mode dio --flash_size keep 0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
              0xe000 $P/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $B/firmware.bin
          done
      - name: Pratinjau animasi wajah Ciki
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          bash tools/firmware/pratinjau/buat.sh "firmware/.pio/libdeps/hadir/Adafruit GFX Library" ciki.gif
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            cikaracak-*-esp32*.bin
            ciki.gif
