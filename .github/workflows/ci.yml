name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  uji:
    name: Uji unit & pemeriksaan web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - run: node tools/cek-web.js

  rls:
    name: Migrasi & aturan akses Supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/supabase/uji.sh

  e2e:
    name: Alur guru di browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/uji_e2e.py
        env:
          E2E_SHOT: e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tangkapan-layar-e2e
          path: e2e-shots/*.png

  presensi:
    name: Presensi di browser (server sungguhan)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Pasang PostgREST
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/postgrest" --version
      - run: bash tools/supabase/server-demo.sh python tests/e2e/uji_presensi.py
        env:
          POSTGREST: ${{ runner.temp }}/postgrest
          E2E_SHOT: e2e-presensi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tangkapan-layar-presensi
          path: e2e-presensi/*.png

  android:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: cikaracak-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # Rilis bertanda tangan: hanya bila secret ANDROID_KEYSTORE_BASE64 sudah diisi (lihat docs/android-rilis.md).
      # Tanpa secret, build rilis tetap dicoba dengan kunci debug untuk memastikan minify/ProGuard tidak rusak.
      - name: Siapkan kunci rilis
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rilis.p12"
            echo "CIKARACAK_KEYSTORE=$RUNNER_TEMP/rilis.p12" >> "$GITHUB_ENV"
            echo "ADA_KUNCI=1" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          CIKARACAK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CIKARACAK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Periksa tanda tangan
        if: env.ADA_KUNCI == '1'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          mv "$APK" cikaracak-rilis.apk
      - uses: actions/upload-artifact@v4
        if: env.ADA_KUNCI == '1'
        with:
          name: cikaracak-release-apk
          path: cikaracak-rilis.apk
      - run: rm -f "$RUNNER_TEMP/rilis.p12"
        if: always()

  firmware:
    name: Firmware alat presensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uji logika firmware (tanda HMAC sama dengan server)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/lib/logika tests/firmware/uji_logika.cpp firmware/lib/logika/*.cpp -o uji_logika
          ./uji_logika
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.1.16
      - run: pio run -d firmware
      - name: Gabungkan menjadi satu berkas siap flash (alamat 0x0)
        run: |
          P=~/.platformio/packages
          for e in uji-kartu hadir uji-kartu-s3 hadir-s3; do
            B=firmware/.pio/build/$e
            case $e in *-s3) CHIP=esp32s3; NAMA=${e%-s3}-esp32s3;; *) CHIP=esp32c3; NAMA=$e-esp32c3;; esac
            python $P/tool-esptoolpy/esptool.py --chip $CHIP merge_bin -o cikaracak-$NAMA.bin \
              --flash_mode dio --flash_size keep 0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
              0xe000 $P/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $B/firmware.bin
            cp $B/firmware.bin cikaracak-$NAMA-pembaruan-0x10000.bin   # pembaruan: pengaturan alat tidak terhapus
          done
      - name: Pratinjau animasi wajah Ciki
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          bash tools/firmware/pratinjau/buat.sh "firmware/.pio/libdeps/hadir/Adafruit GFX Library" ciki.gif
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            cikaracak-*-esp32*.bin
            ciki.gif
