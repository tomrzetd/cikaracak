; Firmware Cikaracak Hadir untuk ESP32-C3 Super Mini.
;   pio run -e uji-kartu -t upload     firmware uji rakitan & kartu (tanpa WiFi)
;   pio run -e hadir -t upload         firmware alat presensi gerbang
;   pio device monitor                 lihat log (115200)
; Pin: include/pin.h. Panduan: docs/hadir-perakitan.md

[platformio]
default_envs = uji-kartu, hadir

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1        ; Serial lewat port USB-C papan
lib_deps =
  miguelbalboa/MFRC522@1.4.11
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.16.2

[env:uji-kartu]
build_src_filter = +<uji-kartu/>

[env:hadir]
build_src_filter = +<hadir/>
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1
