; Firmware Cikaracak Hadir.
;   ESP32-C3 Super Mini:   pio run -e uji-kartu -t upload    |  pio run -e hadir -t upload
;   ESP32-S3-DevKitC-1(U): pio run -e uji-kartu-s3 -t upload |  pio run -e hadir-s3 -t upload
;   pio device monitor     lihat log (115200)
; Pin: include/pin.h. Panduan: docs/hadir-perakitan.md

[platformio]
default_envs = uji-kartu, hadir, uji-kartu-s3, hadir-s3

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
framework = arduino
monitor_speed = 115200
lib_deps =
  miguelbalboa/MFRC522@1.4.11
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.16.2

[c3]
board = esp32-c3-devkitm-1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1        ; Serial lewat port USB-C papan

[s3]
board = esp32-s3-devkitc-1            ; juga untuk DevKitC-1U (antena eksternal)
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0        ; Serial lewat port USB "UART" (CP210x) di DevKitC

[hadir]
build_src_filter = +<hadir/>
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1

[env:uji-kartu]
board = ${c3.board}
build_flags = ${c3.build_flags}
build_src_filter = +<uji-kartu/>

[env:hadir]
board = ${c3.board}
build_flags = ${c3.build_flags}
build_src_filter = ${hadir.build_src_filter}
board_build.filesystem = ${hadir.board_build.filesystem}
board_build.partitions = ${hadir.board_build.partitions}
lib_deps = ${hadir.lib_deps}

[env:uji-kartu-s3]
board = ${s3.board}
build_flags = ${s3.build_flags}
build_src_filter = +<uji-kartu/>

[env:hadir-s3]
board = ${s3.board}
build_flags = ${s3.build_flags}
build_src_filter = ${hadir.build_src_filter}
board_build.filesystem = ${hadir.board_build.filesystem}
board_build.partitions = ${hadir.board_build.partitions}
lib_deps = ${hadir.lib_deps}
