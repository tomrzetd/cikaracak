<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cikaracak</title>
  <meta name="description" content="Aplikasi open source untuk guru: kuis formatif, scan lembar jawaban, dan saran tindak lanjut. Bekerja offline.">
  <meta name="theme-color" content="#DCEBE5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="side clay">
      <div class="who">
        <div class="avatar-guru" id="avatarGuru" aria-hidden="true">G</div>
        <div><b id="namaGuru">Guru</b><small>Laun-laun jadi legok</small></div>
      </div>
      <nav class="menu" aria-label="Menu utama">
        <button class="nav" data-v="beranda"><span class="ic t-sky" style="color:var(--sky-ink)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg></span>Beranda</button>
        <button class="nav" data-v="kelas"><span class="ic t-lilac" style="color:var(--lilac-ink)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9.5" r="2.8"/><path d="M2.5 19c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5zM15.5 19c-.2-1.7-.9-3.2-2-4.3 3-.9 6.4.5 7.5 4.3z"/></svg></span>Kelas &amp; Siswa</button>
        <button class="nav" data-v="kuis"><span class="ic t-peach" style="color:var(--peach-ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="m8.5 9 1.5 1.5L13 8M8.5 15l1.5 1.5L13 14"/></svg></span>Kuis</button>
        <button class="nav" data-v="saran"><span class="ic t-butter" style="color:var(--butter-ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>Saran</button>
        <button class="nav" data-v="riwayat"><span class="ic t-mint" style="color:var(--mint-ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Riwayat &amp; Uji</button>
        <button class="nav" data-v="pengaturan"><span class="ic t-sky" style="color:var(--sky-ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></span>Pengaturan</button>
      </nav>
    </aside>

    <main>
      <div class="top">
        <div class="ttl"><h1 id="judulView">Beranda</h1><span class="pill" id="pillContoh" hidden>Mode contoh</span></div>
        <div class="konteks">
          <label>Kelas <select id="pilihRombel" aria-label="Pilih kelas"></select></label>
          <label>Kuis <select id="pilihKuis" aria-label="Pilih kuis"></select></label>
        </div>
      </div>
      <section class="view" id="v-beranda"></section>
      <section class="view" id="v-kelas" hidden></section>
      <section class="view" id="v-kuis" hidden></section>
      <section class="view" id="v-saran" hidden></section>
      <section class="view" id="v-riwayat" hidden></section>
      <section class="view" id="v-pengaturan" hidden></section>
      <noscript><p class="card clay">Aplikasi ini membutuhkan JavaScript.</p></noscript>
    </main>
  </div>

  <div class="lapis" id="lapis" hidden><div class="sheet clay" id="lapisIsi" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div id="cetak" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
